[package]
name = "monod"
version = "0.1.0"
edition = "2024"
authors = ["Ribzee <cece06pesle@gmail.com"]
licence = "MIT"
description = "A blazingly fast fully customizable system monitor"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.6+spec-1.1.0"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
sysinfo = "0.38.3"
crossterm = "0.29.0"
getgpuname = "0.1.3"
nvml-wrapper = "0.12.0"
amdgpu-sysfs = "0.19.3"
bytesize = "2.3.1"
